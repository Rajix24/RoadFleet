openapi: 3.0.0

info:
  title: "Application Backend"
  version: "1.0.0"
  description: "Application backend for transport goods"

host: http://locahost:2000
basePath: /v1
# schemes:
#   - http
components:
  schemas:
    Message:
      type: object
      properties: 
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tires:
          type: array
          items:
            $ref: '#/components/schemas/Tire'


    RegisterRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          example: Younes

        last_name:
          type: string
          example: Raji

        email:
          type: string
          format: email
          example: younes@example.com

        password:
          type: string
          format: password
          minLength: 8
          example: password123


    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: younes@example.com

        password:
          type: string
          format: password
          example: password123

    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    
    Camion:
      type: object
      properties:
        id: 
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        brand:
          type: string
        model:
          type: string
        vehicleStatus:
          type: string
          enum:
            - available
            - in_use
            - maintenance
            - out_of_service
          default: available
        acquisitionDate: 
          type: string
          format: date-time
        isArchived:
          type: Boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListCamions:
      type: object
      properties:
        camions:
          type: array
          items:
            $ref: '#/components/schemas/Camion' 
    Tire:
      type: object
      required:
        - serialNumber
        - brand
        - size
        - purchaseDate
      properties:
        _id:
          type: string
          format: objectId
        serialNumber:
          type: string
        brand:
          type: string
        size:
          type: string
        status:
          type: string
          enum: [in_stock, mounted, worn, retired]
          default: in_stock
        DateOfDeath:
          type: string
          format: date-time
        purchaseDate:
          type: string
          format: date-time
        price:
          type: number
          minimum: 0
        camion:
          type: string
          nullable: true
          description: MongoDB id of the truck this tire is mounted on
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TireList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tire'
    Remorque:
      type: object
      required:
        - registrationNumber
        - brand
        - model
        - acquisitionDate
      properties:
        _id:
          type: string
          format: objectId
        registrationNumber:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [available, in_use, maintenance, out_of_service]
          default: available
        acquisitionDate:
          type: string
          format: date-time
        camion:
          type: string
          nullable: true
          description: MongoDB id of the truck pulling this trailer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RemorqueList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Remorque'
    Trajet:
      type: object
      required:
        - departureSite
        - arrivalSite
        - merchandise
        - plannedDeparture
        - plannedArrival
        - chauffeur
        - camion
        - remorque
      properties:
        _id:
          type: string
          format: objectId
          readOnly: true
        departureSite:
          type: string
        arrivalSite:
          type: string
        merchandise:
          type: string
        plannedDeparture:
          type: string
          format: date-time
        plannedArrival:
          type: string
          format: date-time
        chauffeur:
          description: Chauffeur MongoDB id on creation; populated chauffeur object in list responses
          oneOf:
            - type: string
              format: objectId
            - $ref: '#/components/schemas/User'
        camion:
          description: Camion MongoDB id on creation; populated camion object in list responses
          oneOf:
            - type: string
              format: objectId
            - $ref: '#/components/schemas/Camion'
        remorque:
          description: Remorque MongoDB id on creation; populated remorque object in list responses
          oneOf:
            - type: string
              format: objectId
            - $ref: '#/components/schemas/Remorque'
        status:
          type: string
          enum: [a_faire, en_cours, termine]
          default: a_faire
        kilometrageDepart:
          type: number
          minimum: 0
        kilometrageArrivee:
          type: number
          minimum: 0
        distance:
          type: number
          minimum: 0
        gasoilVolume:
          type: number
          minimum: 0
        consommationMoyenne:
          type: number
          minimum: 0
        remarque:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    TrajetList:
      type: object
      properties:
        message:
          type: string
          example: seccussful operation
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trajet'
    Maintenance:
      type: object
      required:
        - vehicle
        - type
        - description
        - maintenanceDate
        - mileage
        - cost
      properties:
        _id:
          type: string
          format: objectId
          readOnly: true
        vehicle:
          type: string
          format: objectId
          description: MongoDB id of the truck being maintained
        type:
          type: string
          enum: [vidange, revision, reparation, pneus, freins, autre]
        description:
          type: string
        maintenanceDate:
          type: string
          format: date-time
        mileage:
          type: number
          minimum: 0
        cost:
          type: number
          minimum: 0
        status:
          type: string
          enum: [planned, in_progress, completed, cancelled]
          default: planned
        nextMaintenanceDate:
          type: string
          format: date-time
        nextMaintenanceMileage:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    MaintenanceList:
      type: object
      properties:
        message:
          type: string
          example: operation done
        data:
          type: array
          items:
            $ref: '#/components/schemas/Maintenance'
    securitySchemes:
      BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /maintenance:
    get:
      tags: [Maintenance]
      summary: List maintenance records
      responses:
        "200":
          description: Maintenance records retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceList'
        "500":
          description: Failed to retrieve maintenance records
    post:
      tags: [Maintenance]
      summary: Create a maintenance record
      description: The vehicle field must contain the MongoDB id of an existing truck.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Maintenance'
            example:
              vehicle: 507f1f77bcf86cd799439012
              type: vidange
              description: Oil change
              maintenanceDate: '2026-10-08T10:00:00.000Z'
              mileage: 12000
              cost: 500
              status: planned
              nextMaintenanceDate: '2027-04-08T10:00:00.000Z'
              nextMaintenanceMileage: 22000
      responses:
        "201":
          description: Maintenance record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: operation is done
                  data:
                    $ref: '#/components/schemas/Maintenance'
        "400":
          description: Invalid maintenance data
        "500":
          description: Failed to create maintenance record
  /trajet:
    get:
      tags: [Trajets]
      summary: List trajet records
      description: Returns trajet records with chauffeur, camion, and remorque populated.
      responses:
        "200":
          description: Trajets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrajetList'
        "400":
          description: Could not retrieve trajets
    post:
      tags: [Trajets]
      summary: Register a trajet
      description: Creates a trajet using the MongoDB ids of an existing chauffeur, camion, and remorque.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trajet'
            example:
              departureSite: Casablanca
              arrivalSite: Rabat
              merchandise: General cargo
              plannedDeparture: '2026-10-08T08:00:00.000Z'
              plannedArrival: '2026-10-08T11:00:00.000Z'
              chauffeur: 507f1f77bcf86cd799439011
              camion: 507f1f77bcf86cd799439012
              remorque: 507f1f77bcf86cd799439013
              status: a_faire
      responses:
        "201":
          description: Trajet created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Trajet created successfully
                  data:
                    $ref: '#/components/schemas/Trajet'
        "400":
          description: Invalid trajet data or duplicate record
        "500":
          description: Could not create trajet
  /remorques:
    get:
      tags: [Remorques]
      summary: List remorques
      responses:
        "200":
          description: Remorques retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemorqueList'
    post:
      tags: [Remorques]
      summary: Create a remorque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Remorque'
      responses:
        "201":
          description: Remorque created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Remorque'
        "400":
          description: Invalid remorque data or duplicate registration number
  /remorques/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: objectId
    get:
      tags: [Remorques]
      summary: Get a remorque by id
      responses:
        "200":
          description: Remorque retrieved successfully
        "404":
          description: Remorque not found
    put:
      tags: [Remorques]
      summary: Update a remorque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Remorque'
      responses:
        "200":
          description: Remorque updated successfully
        "400":
          description: Invalid remorque data
        "404":
          description: Remorque not found
    delete:
      tags: [Remorques]
      summary: Delete a remorque
      responses:
        "200":
          description: Remorque deleted successfully
        "404":
          description: Remorque not found
  /tires:
    get:
      tags: [Tires]
      summary: List tires
      responses:
        "200":
          description: Tires retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TireList'
    post:
      tags: [Tires]
      summary: Create a tire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tire'
      responses:
        "201":
          description: Tire created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tire'
        "400":
          description: Invalid tire data or duplicate serial number
  /tires/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: objectId
    get:
      tags: [Tires]
      summary: Get a tire by id
      responses:
        "200":
          description: Tire retrieved successfully
        "404":
          description: Tire not found
    put:
      tags: [Tires]
      summary: Update a tire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tire'
      responses:
        "200":
          description: Tire updated successfully
        "400":
          description: Invalid tire data
        "404":
          description: Tire not found
    delete:
      tags: [Tires]
      summary: Delete a tire
      responses:
        "200":
          description: Tire deleted successfully
        "404":
          description: Tire not found
  /camion/:
    get:
      tags:
        - Camion
      summary: Camions List
      consumes:
        - application/json
      description: "API return list camion the company currently have "
      responses:
        "200":
          description: "successful operation"
          content:     
            application/json:
              schema:
                $ref: '#/components/schemas/ListCamions' 
    post: 
      tags:
        - Camion
      summary: create camion 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Camion'
      responses:
        "201":
          description: "camion has been created"
          content:
            message: user has been created 
            application/json:
              schema:
              $ref: '#/components/schemas/Camion'
        "400":
          description: Invalide camion data 
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get all users in the application

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

        "401":
          description: User is not authenticated

        "403":
          description: User is not authorized
  /auth/register:
      post:
        tags:
          - Auth
        summary: Register a new user
        description: Create a new user account

        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterRequest"

        responses:
          "201":
            description: User registered successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      example: User registered successfully
                    user:
                      $ref: "#/components/schemas/User"

          "400":
            description: Invalid data or user already exists
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticate a user and generate a JWT access token

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        "401":
          description: Invalid email or password

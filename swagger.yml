paths:
  /api/users:
    get:
      tags: 
        - Users
      summary: "List Users"
      description: "List users that are active in the application"
      responses:
        "200":
          description: Successful operation
      content:
        application/json:
          schema:
          $ref: '#/components/schemas/UserList'
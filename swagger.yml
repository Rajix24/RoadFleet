openapi: 3.0.0

info:
  title: "Application Backend"
  version: "1.0.0"
  description: "Application backend for transport goods"

host: http://locahost:2000
basePath: /v1
schemes:
  - http
components:
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

